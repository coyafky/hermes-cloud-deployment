name: ymyy-sales-agent
version: 0.2.1
description: "有膜有漾内部销售助手：销售知识、客户话术与车膜改色预览生成 profile"
hermes_requires: ">=0.12.0"
author: "coyafky"
license: "Private"

env_requires:
  - name: WRAP_PROVIDER_CHAIN
    description: "车膜改色生图 provider 顺序，例如 4sapi_primary,apiyi_primary,xinghu_third,relay_backup"
    required: false
    default: "4sapi_primary,apiyi_primary,xinghu_third,relay_backup"
  - name: WRAP_PROVIDER_4SAPI_PRIMARY_API_KEY
    description: "4sapi OpenAI-compatible image generation API key"
    required: false
    default: ""
  - name: WRAP_PROVIDER_APIYI_PRIMARY_API_KEY
    description: "APIYi OpenAI-compatible image generation API key"
    required: false
    default: ""
  - name: WRAP_PROVIDER_XINGHU_THIRD_API_KEY
    description: "星狐 OpenAI-compatible image generation API key"
    required: false
    default: ""
  - name: WRAP_PROVIDER_XINGHU_THIRD_REQUEST_STYLE
    description: "星狐参考图请求形态；车膜预览必须提交车辆图 + 色卡图，因此使用 refs_array"
    required: false
    default: "refs_array"
  - name: WRAP_PROVIDER_XINGHU_THIRD_WATERMARK
    description: "星狐 watermark 参数；按当前 SDK 示例支持 true/false"
    required: false
    default: "true"
  - name: WRAP_PROVIDER_XINGHU_THIRD_RESPONSE_FORMAT
    description: "星狐图片返回格式；按当前 SDK 示例默认使用 url"
    required: false
    default: "url"

distribution_owned:
  - distribution.yaml
  - README.md
  - SOUL.md
  - profile.yaml
  - skills/
  - knowledge-base/
  - docs/
